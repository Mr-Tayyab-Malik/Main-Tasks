<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up-2</title>
    <style>
      video{
       position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
    }
    .frm{
        border: 2px solid white;
        border-radius: 8px;
        width: 350px;
        height: 420px;
        margin-left: 450px;
        position: relative;
        top: 100px;
    }  
    .sign-up{
     color: white;
     font-size: 40px;
     margin-left: 110px;
     position: relative;
     top: 10px;
    }  
    .frm h3{
       color: white;
     margin-left: 90px;
     position: relative;
     top: -10px;
     font-weight: lighter;
     font-style: italic;
    }
    .contact-Info{
        margin-left: 60px;
        position: relative;
        top: -20px;
    }
    .contact-Info input{
        width: 210px;
        height: 30px;
    }
    .btn{
        background-color: white;
        color: black;
        font-weight: bolder;
        font-size: 15px;
        border: none;
        width: 100px;
        height: 30px;
        margin-left: 120px;
        border-radius: 3px;
        position: relative;
        top: -40px;
    }
    .terms{
        color: white;
        margin-left: 60px;
        position: relative;
        top: -10px;
    }
    #suggestion{
        width: 210px;
        height: 30px;
    }
    #fulladress{
         width: 210px;
        height: 30px;
        position: relative;
        top: -7px;
    }
    </style>
</head>
<body>
    <video autoplay muted loop>
        <source src="https://www.pexels.com/download/video/34268861/" type="video/mp4">
    </video>
    <form class="frm">
        <h1 class="sign-up">Sign Up</h1>
        <h3>Contact Information</h3>
        <div class="contact-Info">
        <label for="Phone-NO" ></label>
        <input type="tel" placeholder="Phone Number" name="Phone-NO">
        <br>
        <br>
        <label for="country"></label>
         <input type="text"  name="country" list="country" placeholder="Select country">
        <datalist id="country">
             <option value="Pakistan">
             <option value="India">
             <option value="Turkey">
             <option value="Saudi Arabia">
             <option value="United Kingdom">
        </datalist>
        <br>
        <br>
        <label for="address"></label>
        <input type="text" placeholder="House no. and street" id="address" name="address">
        <br><br>
        <label for="fulladress"></label>
        <textarea name="fulladress" id="fulladress" placeholder="Enter your complete address"></textarea>
        <select name="suggestion" id="suggestion" >
            <option value="">preferred Contact Method</option>
            <option value="">Contact Method 1</option>
            <option value="">Contact Method 2</option>
            <option value="">Contact Method 3</option>
            <option value="">Contact Method 4</option>
        </select>
        </div>
        <div class="terms">
        <label for="terms">Agreement to Terms</label>
        <input type="checkbox" name="terms">
        </div>
        <br>
        <br>
        <a href="./sign-up-3.html"><button class="btn" type="button">Next</button></a>
        </form>
</body>
</html>
