<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up-1</title>
    <style>
    video{
       position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
    }
       .frm{
        border: 2px solid white;
        border-radius: 8px;
        width: 350px;
        height: 450px;
        margin-left: 450px;
        position: relative;
        top: 100px;
    }  
    .sign-up{
     color: white;
     font-size: 40px;
     margin-left: 110px;
     position: relative;
     top: -20px;
    }  
    .frm h3{
       color: white;
     margin-left: 90px;
     position: relative;
     top: -40px;
     font-weight: lighter;
     font-style: italic;
    }
    .frm hr{
       width: 280px;
       margin-right: 40px;
    }
    .gender{
        color: black;
        background-color: white;
        margin-left: 60px;
        width: 150px;
        height: 20px;
        border-radius: 3px;
    }
    .profile{
        color: white;
        margin-left: 40px;
    }
    .btn{
        background-color: white;
        color: black;
        font-weight: bolder;
        font-size: 15px;
        border: none;
        width: 100px;
        height: 30px;
        margin-left: 120px;
        border-radius: 3px;
    }
    .general-Info{
        margin-left: 60px;
        position: relative;
        top: -20px;
    }
    .general-Info input{
        width: 210px;
        height: 30px;
    }
    </style>
</head>
<body>
    <video autoplay muted loop>
        <source src="https://www.pexels.com/download/video/34268861/" type="video/mp4">
    </video>
    <form class="frm">
        <h1 class="sign-up">Sign Up</h1>
        <h3>General Information</h3>
        <div class="general-Info">
        <label for="name" ></label>
        <input type="text" placeholder="Name" name="name">
        <br>
        <br>
         <label for="email"></label>
        <input type="email" placeholder="Email" name="email">
        <br>
        <br>
        <label for="pass"></label>
        <input type="password" placeholder="password" name="pass">
        <br>
        <br>
        <label for="DOB"></label>
        <input type="date"  name="DOB">
        <br>
        </div>
        <div class="gender">
        <label for="gender">Male</label>
        <input type="radio"  name="gender">
        <label for="gender">Female</label>
        <input type="radio" name="gender">
        </div>
         <br>
        <div class="profile">
        <label for="profile" >profile:</label>
        <input type="file" name="profile">
        </div>
        <hr>
        <a href="./sign-up2.html"><button class="btn" type="button">Next</button></a>
        </form>
</body>
</html>
